services:
  translator:
    build: .
    container_name: translator
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # SQLite 库与任务工作目录持久化（TR_DATA_DIR=/data）
      # 服务以非 root(uid/gid 1000) 运行，绑定挂载属主不由镜像决定：
      # 首次启动前需在宿主机执行 chown -R 1000:1000 ./data，否则 SQLite 无法写入
      - ./data:/data
    restart: unless-stopped
