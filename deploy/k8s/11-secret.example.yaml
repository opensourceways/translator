# 敏感配置模板——真实 Secret 用 kubectl 从 .env 生成，勿提交真实值：
#   kubectl -n translator create secret generic translator-secret \
#     --from-literal=GITCODE_TOKEN=<token> \
#     --from-literal=TR_WEBHOOK_TOKEN=<token> \
#     --from-literal=TR_ADMIN_TOKEN= \
#     --from-literal=TR_DASH_TOKEN=
apiVersion: v1
kind: Secret
metadata:
  name: translator-secret
  namespace: translator
type: Opaque
stringData:
  # 默认 token（必需）：对译稿权威仓有读权限，对未配置命名 token 的目标仓有 Fork/PR 权限
  GITCODE_TOKEN: ""
  # webhook 鉴权 token：GitCode webhook URL 后带 ?token=<此值>
  TR_WEBHOOK_TOKEN: ""
  # 管理端点 token（X-Admin-Token），空则管理端点放开（内网默认）
  TR_ADMIN_TOKEN: ""
  # Dashboard / 只读 API token（可选），空则只读端点放开
  TR_DASH_TOKEN: ""
  # 命名 token（可选，按需添加）：键名 TR_TOKEN_<名称大写>，服务侧只保存名称
  # 引用、不保存明文。示例：
  # TR_TOKEN_MINDSTUDIO: ""
  # TR_TOKEN_CANN_ROBOT: ""
