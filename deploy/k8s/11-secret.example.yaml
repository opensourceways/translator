# 敏感配置模板——真实 Secret 用 kubectl 从 .env 生成，勿提交真实值：
#   kubectl -n docsync create secret generic docsync-secret \
#     --from-literal=GITCODE_TOKEN=<token> \
#     --from-literal=DS_WEBHOOK_TOKEN=<token> \
#     --from-literal=DS_ADMIN_TOKEN= \
#     --from-literal=DS_DASH_TOKEN=
apiVersion: v1
kind: Secret
metadata:
  name: docsync-secret
  namespace: docsync
type: Opaque
stringData:
  # 默认 token（必需）：对译稿权威仓有读权限，对目标仓有 Fork/PR 权限
  GITCODE_TOKEN: ""
  # webhook 鉴权 token：GitCode webhook URL 后带 ?token=<此值>
  DS_WEBHOOK_TOKEN: ""
  # 管理端点 token（X-Admin-Token），空则管理端点放开（内网默认）
  DS_ADMIN_TOKEN: ""
  # Dashboard / 只读 API token（可选），空则只读端点放开
  DS_DASH_TOKEN: ""
