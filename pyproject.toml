[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "translator"
version = "1.0.0"
description = "译稿自动提 PR 服务 — 通过 HTTP API 接收权威仓文件路径，自动向社区仓提交 AtomGit Pull Request"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0",
]

[project.scripts]
translator = "translator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]
services = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# 显式列出两个顶层包（webapp 与 translator 平级）
[tool.setuptools]
packages = ["translator", "webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
